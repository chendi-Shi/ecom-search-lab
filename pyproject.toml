[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-search-lab"
version = "0.4.0"
description = "CPU ecommerce search and reproducible ranking improvements on Amazon ESCI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ann = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "sentence-transformers>=5.1,<5.3"]
full = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "sentence-transformers>=5.1,<5.3", "torch>=2.2,<3", "transformers>=4.40,<5", "Pillow>=10,<13", "pyarrow>=15,<25"]
training = ["lightgbm>=4.7,<5"]

[project.scripts]
ecom-search = "ecom_search.cli:main"

[tool.setuptools.packages.find]
include = ["ecom_search*"]
